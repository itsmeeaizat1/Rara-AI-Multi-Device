# Koyeb deployment config for Nova AI WhatsApp Bot
# Deploy: koyeb app create nova-bot --git github.com/itsmeeaizat/Ourin-Ai-Whatsapp-Bot-Multi-Device --git-branch main
services:
  - name: nova-bot
    git:
      repository: github.com/itsmeeaizat/Ourin-Ai-Whatsapp-Bot-Multi-Device
      branch: main
    build:
      dockerfile: Dockerfile
    ports:
      - port: 3000
        protocol: http
    routes:
      - path: /
    env:
      - name: NODE_ENV
        value: production
    instance:
      type: free
    regions:
      - fra
