name: Auto Sync (Read Only)

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Repository Sync Status
      run: |
        echo "============================================"
        echo "  Auto Sync — Repository Status"
        echo "============================================"
        echo "Time: $(date -u)"
        echo "Branch: $(git branch --show-current)"
        echo "Recent commits:"
        git log --oneline -5
        echo "✅ Repository is up to date"
