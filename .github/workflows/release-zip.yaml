name: Create Release Zip

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Zip repository (exclude .git & node_modules)
      run: |
        zip -r bot-source.zip . -x ".git/*" "node_modules/*" ".github/*"
    - name: Upload Release
      uses: softprops/action-gh-release@v2
      with:
        files: bot-source.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
