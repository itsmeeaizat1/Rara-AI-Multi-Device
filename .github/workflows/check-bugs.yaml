name: Continuous Bug Scanner

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:

jobs:
  scan-errors:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install Dependencies
      run: |
        if [ -f package.json ]; then
          npm install
        else
          echo "Tidak ada package.json"
        fi

    - name: Scan JS Files for Syntax Errors
      run: |
        echo "=== MEMULAI PEMINDAIAN SCRIPT BOT (MODE LANJUT TERUS) ==="
        
        # Melakukan pemindaian file .js dan mencatat error sebagai peringatan tanpa menghentikan workflow
        find . -path "./node_modules" -prune -o -name "*.js" -print | while read file; do
          if ! node -c "$file"; then
            echo "⚠️ Peringatan: Ditemukan error pada file -> $file"
          fi
        done
        
        echo "=== PEMINDAIAN SELESAI, WORKFLOW BERHASIL RUN SAMPAI AKHIR ==="
