name: Keep Alive (Read Only)

on:
  schedule:
    - cron: '0 0 */5 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Repository Status Check
      run: |
        echo "============================================"
        echo "  Keep Alive — Repository Status"
        echo "============================================"
        echo "Time: $(date -u)"
        echo "Branch: $(git branch --show-current)"
        echo "Last commit: $(git log -1 --oneline)"
        echo "Total commits: $(git rev-list --count HEAD)"
        echo "✅ Repository is accessible and active"
        echo "ℹ️ No commits pushed (read-only mode)"
