name: Feature Badge Info (Read Only)

on:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  show-badge:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Get Last Commit Message
      id: commit
      run: |
        LAST_COMMIT=$(git log -1 --pretty=format:"%s")
        echo "feature_name=$LAST_COMMIT" >> $GITHUB_OUTPUT
        echo "============================================"
        echo "  Latest Feature: $LAST_COMMIT"
        echo "============================================"
        echo "ℹ️ Badge update di-skip (read-only mode)"
        echo "Untuk update badge, edit README.md secara manual"
