name: ESLint Check (Report Only)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eslint-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies (skip lifecycle scripts)
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Create minimal ESLint config (ESM)
        run: |
          cat > /tmp/eslint-min.json << 'EOF'
          {
            "env": { "es2021": true, "node": true },
            "parserOptions": { "ecmaVersion": 2022, "sourceType": "module" },
            "rules": {
              "no-unused-vars": "warn",
              "no-undef": "off"
            }
          }
          EOF

      - name: Run ESLint (check only, NO --fix, NO commit)
        run: |
          echo "============================================"
          echo "  ESLint CHECK — Report Only (no auto-fix)"
          echo "============================================"
          npx eslint "plugins/" --ext .js --config /tmp/eslint-min.json -f unix -o eslint-report.txt || true
          
          if [ -f eslint-report.txt ] && [ -s eslint-report.txt ]; then
            echo ""
            echo "⚠️ Ditemukan warning/issue:"
            cat eslint-report.txt
          else
            echo "✅ Tidak ada issue ESLint yang signifikan"
          fi

      - name: Upload ESLint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eslint-report
          path: eslint-report.txt
