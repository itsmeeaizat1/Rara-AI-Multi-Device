name: Auto Clean Session Cache

on:
  schedule:
    # Berjalan otomatis setiap hari Minggu pukul 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
    clean-cache:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Remove Junk Session Files
          run: |
            echo "Membersihkan file sampah sesi lama..."
            # Menghapus file cache sampah tapi tetap mengamankan kredensial utama jika ada
            rm -rf session/pre-key* session/sender-key* session/app-state-sync*
            echo "Pembersihan selesai."
