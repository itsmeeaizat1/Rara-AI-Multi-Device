name: Bot – Prepare & Check

on:
  workflow_dispatch:

jobs:
  prepare-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install system libs (for canvas)
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libjpeg-dev libpango1.0-dev libgif-dev libpng-dev libfreetype6-dev build-essential pkg-config

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci --ignore-scripts; else npm install --ignore-scripts; fi

      - name: Verify installed canvas packages
        run: |
          node -e "import('@napi-rs/canvas').then(() => console.log('✅ napi-canvas OK')).catch(e => { console.error('❌ napi-canvas:', e.message); process.exit(1) })"

      - name: Syntax check (ESM-aware)
        run: |
          IS_ESM=$(grep -q '"type":\s*"module"' package.json 2>/dev/null && echo "true" || echo "false")
          find . -path ./node_modules -prune -o -path ./.git -prune -o -name "*.js" -print | while read f; do
            if [ "$IS_ESM" = "true" ]; then
              node --check --input-type=module < "$f" 2>&1 | head -3
            else
              node --check "$f" 2>&1 | head -3
            fi
          done
          echo "✅ Syntax check selesai"
