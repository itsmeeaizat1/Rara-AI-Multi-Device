<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Gabung 2048</title>
<style>
* { -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; box-sizing: border-box; margin: 0; padding: 0; }
body { margin: 0; background: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #fff; touch-action: none; overflow: hidden; }
.wrapper { width: 100%; max-width: 480px; margin: auto; padding: 12px; }
.card { background: linear-gradient(180deg, rgba(15,18,26,0.97), rgba(10,12,18,0.97)); border: 2px solid #f59e0b; border-radius: 20px; overflow: hidden; box-shadow: 0 14px 44px rgba(0,0,0,0.75); padding: 14px; }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.title { font-size: 10px; letter-spacing: 1.5px; color: #f59e0b; font-weight: 800; text-transform: uppercase; }
h2 { font-size: 17px; font-weight: 900; color: #fff; margin-top: 2px; }
.score-badge { font-size: 20px; font-weight: 900; color: #f59e0b; text-shadow: 0 0 12px rgba(245,158,11,0.5); font-variant-numeric: tabular-nums; }
.best-badge { font-size: 10px; color: #94a3b8; font-variant-numeric: tabular-nums; }
.stat-row { display: flex; gap: 8px; margin-bottom: 8px; }
.stat-pill { flex: 1; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 5px 8px; text-align: center; }
.stat-pill .lbl { font-size: 8px; letter-spacing: 1px; color: #64748b; text-transform: uppercase; font-weight: 700; }
.stat-pill .val { font-size: 13px; font-weight: 900; color: #fff; font-variant-numeric: tabular-nums; }
#game-container { position: relative; width: 100%; height: 350px; border-radius: 14px; overflow: hidden; border: 2px solid #1e293b; }
canvas { width: 100%; height: 100%; display: block; background: #070a12; }
.controls { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
.btn { padding: 13px; font-size: 16px; font-weight: 800; border: none; border-radius: 12px; cursor: pointer; color: #fff; background: linear-gradient(135deg, #f59e0b, #b45309); box-shadow: 0 4px 14px rgba(245,158,11,0.35); }
.btn:active { transform: scale(0.95); filter: brightness(0.9); }
.btn-restart { grid-column: 1 / -1; background: linear-gradient(135deg, #3b82f6, #1d4ed8); font-size: 13px; }
.credit-bar { margin-top: 10px; text-align: center; font-size: 10px; font-weight: 800; letter-spacing: 1.5px; color: #94a3b8; text-transform: uppercase; border-top: 1px dashed rgba(255,255,255,0.12); padding-top: 8px; }
.credit-bar span { color: #f59e0b; }

/* anti-scroll biar swipe game gak geser chat WA */
html, body { overscroll-behavior: contain; }
.guide { margin-top: 10px; }
.guide-table { width: 100%; border-collapse: collapse; font-size: 11px; }
.guide-table td { padding: 5px 8px; border: 1px solid rgba(255,255,255,0.1); color: #cbd5e1; }
.guide-table td:first-child { color: #fff; font-weight: 800; white-space: nowrap; }
.guide-table .hd { text-align: center; font-weight: 900; color: #94a3b8; letter-spacing: 1px; text-transform: uppercase; font-size: 9px; }
.guide-table .hd2 { text-align: center; color: #64748b; font-size: 10px; }
</style>
</head>
<body>
<div class="wrapper">
  <div class="card">
    <div class="header">
      <div>
        <div class="title">Rara AI</div>
        <h2>Gabung 2048 🔢</h2>
      </div>
      <div style="text-align:right;">
        <div class="score-badge" id="score">0</div>
        <div class="best-badge" id="best">Best 0</div>
      </div>
    </div>
    <div class="stat-row">
      <div class="stat-pill"><div class="lbl">Langkah</div><div class="val" id="mvStat">0</div></div>
      <div class="stat-pill"><div class="lbl">Tile Maks</div><div class="val" id="mxStat">2</div></div>
      <div class="stat-pill"><div class="lbl">Status</div><div class="val" id="stStat">Main</div></div>
    </div>
    <div id="game-container"><canvas id="c"></canvas></div>
    <div class="controls">
      <button class="btn" id="upBtn">▲</button>
      <button class="btn" id="leftBtn">◀</button>
      <button class="btn" id="downBtn">▼</button>
      <button class="btn" id="rightBtn">▶</button>
      <button class="btn btn-restart" id="restartBtn">⟳ Main Lagi</button>
    </div>
    <div class="guide">
      <table class="guide-table">
      <tr><td class="hd" colspan="2">📜 Panduan Kontrol</td></tr>
            <tr><td>Swipe ke 4 arah</td><td>Geser & gabung angka sama jadi 2× lipat</td></tr>
      <tr><td>Tap ⟳ Baru</td><td>Mulai papan baru kapan aja</td></tr>
      <tr><td class="hd2" colspan="2">Skor &amp; rekor otomatis tersimpan di browser</td></tr>
      </table>
    </div>
    <div class="credit-bar">RARA AI - MULTI DEVICE ⚡</div>
  </div>
</div>
<script>
(function () {
  var cvs = document.getElementById('c'), ctx = cvs.getContext('2d');
  var scoreEl = document.getElementById('score'), bestEl = document.getElementById('best');
  var mvEl = document.getElementById('mvStat'), mxEl = document.getElementById('mxStat'), stEl = document.getElementById('stStat');
  var N = 4, board, score, moves, dead, won, best = 0, W, H, size, pad, ox, oy;
  var COLORS = {
    2: '#eee4da', 4: '#ede0c8', 8: '#f2b179', 16: '#f59563', 32: '#f67c5f', 64: '#f65e3b',
    128: '#edcf72', 256: '#edcc61', 512: '#edc850', 1024: '#edc53f', 2048: '#edc22e'
  };
  try { best = parseInt(localStorage.getItem('rara_2048_best') || '0', 10) || 0; } catch (e) { best = 0; }
  bestEl.textContent = 'Best ' + best;

  function resize() {
    W = cvs.clientWidth; H = cvs.clientHeight;
    cvs.width = W; cvs.height = H;
    size = Math.min(W - 24, H - 24); pad = 8;
    ox = (W - size) / 2; oy = (H - size) / 2;
  }
  function reset() {
    board = []; for (var r = 0; r < N; r++) board.push(new Array(N).fill(0));
    score = 0; moves = 0; dead = false; won = false;
    scoreEl.textContent = '0'; mvEl.textContent = '0'; mxEl.textContent = '2'; stEl.textContent = 'Main';
    spawn(); spawn();
  }
  function emptyCells() {
    var out = [];
    for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) if (!board[r][c]) out.push([r, c]);
    return out;
  }
  function spawn() {
    var e = emptyCells();
    if (!e.length) return;
    var p = e[(Math.random() * e.length) | 0];
    board[p[0]][p[1]] = Math.random() < 0.9 ? 2 : 4;
  }
  function slideLine(line) {
    var v = line.filter(function (x) { return x; }), out = [], gained = 0;
    for (var i = 0; i < v.length; i++) {
      if (i + 1 < v.length && v[i] === v[i + 1]) { out.push(v[i] * 2); gained += v[i] * 2; i++; }
      else out.push(v[i]);
    }
    while (out.length < N) out.push(0);
    return { line: out, gained: gained };
  }
  function move(dir) {
    if (dead) return;
    var changed = false, gained = 0;
    for (var i = 0; i < N; i++) {
      var line = [];
      for (var j = 0; j < N; j++) {
        if (dir === 'left') line.push(board[i][j]);
        else if (dir === 'right') line.push(board[i][N - 1 - j]);
        else if (dir === 'up') line.push(board[j][i]);
        else line.push(board[N - 1 - j][i]);
      }
      var res = slideLine(line);
      gained += res.gained;
      for (var k = 0; k < N; k++) {
        var val = res.line[k];
        if (dir === 'left') { if (board[i][k] !== val) changed = true; board[i][k] = val; }
        else if (dir === 'right') { if (board[i][N - 1 - k] !== val) changed = true; board[i][N - 1 - k] = val; }
        else if (dir === 'up') { if (board[k][i] !== val) changed = true; board[k][i] = val; }
        else { if (board[N - 1 - k][i] !== val) changed = true; board[N - 1 - k][i] = val; }
      }
    }
    if (changed) {
      score += gained; moves++;
      if (gained > 0) scoreEl.textContent = score;
      mvEl.textContent = moves;
      spawn();
      var max = 0;
      for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) if (board[r][c] > max) max = board[r][c];
      mxEl.textContent = max;
      if (max >= 2048 && !won) { won = true; stEl.textContent = 'Menang!'; }
      if (!canMove()) { dead = true; stEl.textContent = 'Game Over'; }
      if (score > best) { best = score; bestEl.textContent = 'Best ' + best; try { localStorage.setItem('rara_2048_best', String(best)); } catch (e) {} }
    }
  }
  function canMove() {
    if (emptyCells().length) return true;
    for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) {
      var v = board[r][c];
      if (c + 1 < N && board[r][c + 1] === v) return true;
      if (r + 1 < N && board[r + 1][c] === v) return true;
    }
    return false;
  }
  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#070a12'; ctx.fillRect(0, 0, W, H);
    var cell = (size - pad * (N + 1)) / N;
    ctx.fillStyle = 'rgba(255,255,255,0.05)';
    for (var r = 0; r <= N; r++) for (var c = 0; c <= N; c++) {}
    ctx.fillStyle = '#1b2431';
    ctx.fillRect(ox, oy, size, size);
    for (var r2 = 0; r2 < N; r2++) for (var c2 = 0; c2 < N; c2++) {
      var x = ox + pad + c2 * (cell + pad), y = oy + pad + r2 * (cell + pad);
      var v = board[r2][c2];
      ctx.fillStyle = v ? (COLORS[v] || '#3c3a32') : 'rgba(255,255,255,0.04)';
      ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, cell, cell, 10) : ctx.rect(x, y, cell, cell);
      ctx.fill();
      if (v) {
        ctx.fillStyle = v <= 4 ? '#6b6257' : '#fff';
        var fs = cell * (v >= 1024 ? 0.28 : v >= 128 ? 0.34 : 0.42);
        ctx.font = '900 ' + fs + 'px sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(String(v), x + cell / 2, y + cell / 2 + 1);
      }
    }
    if (won && !dead) {
      ctx.fillStyle = 'rgba(245,158,11,0.9)';
      ctx.font = '900 16px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('🎉 2048! Lanjut gabung tile lebih gede', W / 2, oy - 8 > 12 ? oy - 8 : 12);
    }
    if (dead) {
      ctx.fillStyle = 'rgba(0,0,0,0.68)'; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#f87171'; ctx.font = '900 24px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('Game Over', W / 2, H / 2 - 14);
      ctx.fillStyle = '#fff'; ctx.font = '700 14px sans-serif';
      ctx.fillText('Skor ' + score + ' — tap ⟳ Main Lagi', W / 2, H / 2 + 14);
    }
  }
  function bind(id, fn) { document.getElementById(id).addEventListener('pointerdown', function (e) { e.preventDefault(); fn(); }); }
  bind('upBtn', function () { move('up'); });
  bind('downBtn', function () { move('down'); });
  bind('leftBtn', function () { move('left'); });
  bind('rightBtn', function () { move('right'); });
  bind('restartBtn', reset);
  resize(); reset();
  requestAnimationFrame(function loop() { draw(); requestAnimationFrame(loop); });
})();

// 🔹 anti-scroll: kunci gesture di dalam game (chat WA gak kegeser)
["touchstart", "touchmove", "gesturestart", "gesturechange"].forEach(function (ev) {
  document.addEventListener(ev, function (e) { if (e.cancelable) e.preventDefault(); }, { passive: false });
});
</script>
</body>
</html>
